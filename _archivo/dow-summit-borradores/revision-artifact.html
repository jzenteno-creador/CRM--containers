<title>Dow Summit 2026 · Sala de revisión</title>
<style>
/* ─────────────────────────────────────────────────────────────
   TOKENS — "Puerto": petróleo/teal + naranja de señal.
   Los semánticos (semáforo) son independientes del acento.
   ───────────────────────────────────────────────────────────── */
:root{
  color-scheme: light;
  --paper:#EBEFEC;
  --surface:#FFFFFF;
  --surface-2:#E2E8E4;
  --surface-3:#D7DFDA;
  --line:#CFD8D3;
  --line-2:#B3C0B9;
  --text:#101E1C;
  --text-2:#465854;
  --text-3:#74857F;
  --accent:#B8460F;
  --accent-2:#8C3308;
  --accent-wash:#F8E8DF;
  --ok:#256B49;
  --ok-wash:#DEEDE4;
  --warn:#8A5F0C;
  --warn-wash:#F5EAD2;
  --crit:#A0332A;
  --crit-wash:#F6E1DD;
  --shadow:0 1px 2px rgba(16,30,28,.06), 0 8px 24px -12px rgba(16,30,28,.18);

  --ui:"Segoe UI Variable Display",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --read:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --data:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;

  --t-xs:.6875rem; --t-sm:.8125rem; --t-base:.9375rem;
  --t-md:1.0625rem; --t-lg:1.3125rem; --t-xl:1.75rem; --t-2xl:2.125rem;

  --rail:262px; --bar:54px;
}
@media (prefers-color-scheme: dark){

    --paper:#091416; --surface:#0F1E20; --surface-2:#152729; --surface-3:#1C3134;

    --accent:#E4762F; --accent-2:#F09553; --accent-wash:#2A1A11;
    --ok:#5CB088; --ok-wash:#12261D; --warn:#D6A544; --warn-wash:#2A2211;
    --crit:#E5716A; --crit-wash:#2B1512;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}

  --paper:#091416; --surface:#0F1E20; --surface-2:#152729; --surface-3:#1C3134;

  --line:#CFD8D3; --line-2:#B3C0B9; --text:#101E1C; --text-2:#465854; --text-3:#74857F;
  --accent:#B8460F; --accent-2:#8C3308; --accent-wash:#F8E8DF;
  --ok:#256B49; --ok-wash:#DEEDE4; --warn:#8A5F0C; --warn-wash:#F5EAD2;

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--ui);
  font-size:var(--t-base);line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--data);font-variant-numeric:tabular-nums}

/* ── Barra superior ─────────────────────────────────────────── */
.bar{position:sticky;top:0;z-index:40;height:var(--bar);display:flex;align-items:center;
  gap:14px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-id{display:flex;align-items:baseline;gap:9px;min-width:0;overflow:hidden}
.bar-id b{font-size:var(--t-base);font-weight:650;letter-spacing:-.01em;white-space:nowrap;

.bar-spacer{flex:1}
.meter{display:flex;align-items:center;gap:9px}
.meter-track{width:98px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.meter-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .25s ease}
.meter-txt{font-family:var(--data);font-size:var(--t-xs);color:var(--text-2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{border:1px solid var(--line-2);border-radius:6px;padding:6px 12px;font-size:var(--t-sm);
  font-weight:550;background:var(--surface);white-space:nowrap;
  transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--text-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}

.btn-icon{padding:6px 9px}
.bar-alert{display:flex;align-items:center;gap:6px;font-size:var(--t-sm);font-weight:550;
  color:var(--crit);background:var(--crit-wash);border:1px solid transparent;
  border-radius:6px;padding:5px 10px}
.bar-alert:hover{border-color:var(--crit)}
#burger{display:none}

/* ── Grilla: índice fijo + documento continuo ───────────────── */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);
  align-items:start;max-width:1720px;margin:0 auto}

/* ── Índice ─────────────────────────────────────────────────── */
.rail{position:sticky;top:var(--bar);height:calc(100vh - var(--bar));overflow-y:auto;
  border-right:1px solid var(--line);background:var(--surface);padding:12px 0 40px}
.rail-grp{padding:14px 18px 3px;font-size:var(--t-xs);text-transform:uppercase;

.rail-item{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  padding:6px 18px;border-left:3px solid transparent;transition:background .1s}
.rail-item:hover{background:var(--surface-2)}
.rail-item.aqui{background:var(--accent-wash);border-left-color:var(--accent)}
.rail-n{font-family:var(--data);font-size:var(--t-xs);color:var(--text-3);
  min-width:19px;padding-top:2px;font-variant-numeric:tabular-nums}
.rail-item.aqui .rail-n{color:var(--accent);font-weight:700}
.rail-t{flex:1;font-size:var(--t-sm);line-height:1.35;color:var(--text-2);min-width:0;

.rail-item.aqui .rail-t{color:var(--text);font-weight:550}
.dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none;background:var(--line-2)}
.dot.ok{background:var(--ok)} .dot.falta{background:var(--warn)} .dot.decidir{background:var(--crit)}
.dot.hecho{background:var(--accent)}
.rail-risk{margin:4px 12px 8px;padding:9px 12px;border-radius:7px;background:var(--crit-wash);

  align-items:center;width:calc(100% - 24px);text-align:left}
.rail-risk.aqui{box-shadow:inset 0 0 0 1.5px var(--crit)}

/* ── Documento ──────────────────────────────────────────────── */
.doc{padding:0 36px 120px;min-width:0}
.wrap{max-width:1420px;margin:0 auto}

/* Separador entre preguntas: la línea que pediste */
.qb{border-top:2px solid var(--line-2);padding:34px 0 6px;scroll-margin-top:calc(var(--bar) + 14px)}
.qb:first-of-type{border-top:none}
.doc-sec{margin:44px 0 0;padding:9px 0 7px;font-size:var(--t-xs);text-transform:uppercase;
  letter-spacing:.13em;font-weight:750;color:var(--accent);display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--bar) + 14px)}
.doc-sec::after{content:"";flex:1}
.doc-sec + .qb{border-top:none;padding-top:24px}

.qhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;align-items:baseline}
.q-num{font-family:var(--data);font-size:var(--t-2xl);font-weight:600;color:var(--accent);
  line-height:1;font-variant-numeric:tabular-nums;grid-row:span 2}
.q-title{margin:0;font-size:var(--t-lg);font-weight:600;line-height:1.3;

.chip{font-size:var(--t-xs);font-weight:650;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:4px;background:var(--surface-2);color:var(--text-2)}
.chip.escribir{background:var(--accent-wash);color:var(--accent)}
.chip.falta{background:var(--warn-wash);color:var(--warn)}
.chip.decidir{background:var(--crit-wash);color:var(--crit)}
.chip.ok{background:var(--ok-wash);color:var(--ok)}
.q-pt{font-size:var(--t-sm);color:var(--text-3);font-style:italic;margin:0}

.busca{display:flex;gap:12px;margin:16px 0 20px;padding:12px 16px;border-radius:8px;

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}

.card.sel{border-color:var(--accent);box-shadow:var(--shadow)}

.card.sel .card-key{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.card-top{display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--surface-2);
  border-bottom:1px solid var(--line);transition:background .15s,color .15s}
.card-key{font-family:var(--data);font-size:var(--t-xs);font-weight:700;width:19px;height:19px;
  display:grid;place-items:center;border:1px solid var(--line-2);border-radius:4px;
  color:var(--text-3);flex:none}
.card-id{min-width:0;flex:1}
.card-tag{font-size:var(--t-xs);font-weight:750;letter-spacing:.11em;text-transform:uppercase;
  display:block;line-height:1.3}
.card-para{font-size:var(--t-xs);color:var(--text-3);display:block;line-height:1.3}
.card-body{flex:1;padding:15px 18px;font-family:var(--read);font-size:var(--t-base);
  line-height:1.6;color:var(--text)}
.card-body p{margin:0 0 .78em}
.card-body p:last-child{margin-bottom:0}
.card-foot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.card-count{font-family:var(--data);font-size:var(--t-xs);color:var(--text-3);
  font-variant-numeric:tabular-nums;flex:1}
.card-count.over{color:var(--warn);font-weight:650}

/* ── Opción múltiple y datos ────────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:16px 20px;margin-top:14px;max-width:1080px}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:6px 10px;border-radius:6px;
  font-size:var(--t-base);color:var(--text-3)}
.opt.on{background:var(--accent-wash);color:var(--text);font-weight:600}
.radio{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line-2);
  flex:none;margin-top:4px}
.opt.on .radio{border-color:var(--accent);border-width:4.5px}
.opt.multi .radio{border-radius:4px}
.dato{font-family:var(--data);font-size:var(--t-md);background:var(--surface-2);
  border:1px solid var(--line);border-radius:7px;padding:11px 15px;display:inline-block}
.dato.vacio{color:var(--warn);background:var(--warn-wash);border-color:transparent;font-style:italic}
.why{display:flex;gap:11px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.why + .why{margin-top:10px;padding-top:10px}
.why-lbl{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.09em;font-weight:700;
  color:var(--text-3);white-space:nowrap;padding-top:2px;min-width:74px}
.why p{margin:0;color:var(--text-2);font-size:var(--t-base)}
.why.alt .why-lbl{color:var(--warn)}

.acciones{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.note{margin-top:14px;max-width:1080px}
.note label{display:block;font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.09em;
  font-weight:650;color:var(--text-3);margin-bottom:6px}
.note textarea{width:100%;min-height:54px;resize:vertical;padding:10px 13px;font:inherit;
  font-size:var(--t-base);color:var(--text);background:var(--surface);border:1px solid var(--line);
  border-radius:7px}
.note textarea:focus{border-color:var(--accent);outline:none}
.note textarea::placeholder{color:var(--text-3)}

/* ── Bloque de pendientes (arriba de todo) ──────────────────── */
.hero{padding:38px 0 6px;scroll-margin-top:calc(var(--bar) + 14px)}
.hero h1{margin:0 0 8px;font-size:var(--t-2xl);font-weight:600;letter-spacing:-.02em;
  text-wrap:balance;line-height:1.15}
.hero > p{margin:0 0 26px;font-size:var(--t-md);color:var(--text-2);max-width:64ch;
  font-family:var(--read);line-height:1.6}
.risk-grp{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.1em;font-weight:700;
  color:var(--text-3);margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.risk-grp::after{content:"";flex:1;height:1px;background:var(--line)}
.risks{display:flex;flex-direction:column;gap:10px;max-width:1080px}
.risk{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:start;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:14px 17px;
  border-left:3px solid var(--line-2)}
.risk.crit{border-left-color:var(--crit)}
.risk.warn{border-left-color:var(--warn)}
.risk.done{border-left-color:var(--ok);opacity:.82}
.risk-ico{font-family:var(--data);font-size:var(--t-xs);font-weight:700;letter-spacing:.04em;
  padding:3px 0;text-align:center;border-radius:4px}
.risk.crit .risk-ico{background:var(--crit-wash);color:var(--crit)}

.risk.done .risk-ico{background:var(--ok-wash);color:var(--ok)}
.risk h3{margin:0 0 4px;font-size:var(--t-base);font-weight:650;line-height:1.35}

.who{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin:22px 0 0;padding:14px 17px;

.who label{font-size:var(--t-sm);color:var(--text-2);font-weight:550}
.who input{font:inherit;font-size:var(--t-base);padding:7px 11px;border:1px solid var(--line);

.fuente{margin-top:26px;padding:16px 19px;background:var(--surface-2);border-radius:9px;

.fuente h4{margin:0 0 9px;font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.09em;
  color:var(--text-3);font-weight:700}
.fuente table{width:100%;border-collapse:collapse;font-family:var(--data);
  font-size:var(--t-sm);font-variant-numeric:tabular-nums}
.fuente td{padding:3px 0;border-bottom:1px solid var(--line)}
.fuente td:last-child{text-align:right;font-weight:600;color:var(--text)}

/* ── Cierre: lo elegido, siempre visible ────────────────────── */
.cierre{margin-top:52px;padding-top:30px;border-top:2px solid var(--line-2);
  scroll-margin-top:calc(var(--bar) + 14px);max-width:1080px}
.cierre h2{margin:0 0 6px;font-size:var(--t-lg);font-weight:600}
.cierre > p{margin:0 0 16px;color:var(--text-2)}
.cierre textarea{width:100%;min-height:280px;padding:15px 17px;font-family:var(--data);
  font-size:var(--t-sm);line-height:1.6;color:var(--text);background:var(--surface);
  border:1px solid var(--line);border-radius:9px;resize:vertical}
.cierre textarea:focus{border-color:var(--accent);outline:none}

/* ── Responsive ─────────────────────────────────────────────── */
@media (max-width:1300px){
  /* Tres columnas de prosa dejan de ser legibles: se apilan. */
  .cards{grid-template-columns:minmax(0,1fr);max-width:760px}
}
@media (max-width:900px){
  :root{--rail:0px}
  #burger{display:inline-flex}
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:var(--bar);left:0;width:284px;z-index:35;
    transform:translateX(-102%);transition:transform .22s ease;
    box-shadow:0 16px 40px -16px rgba(0,0,0,.45)}
  .rail.open{transform:translateX(0)}
  .doc{padding:0 18px 90px}
  .bar{gap:10px;padding:0 12px}
  .bar-id span{display:none}
  .risk{grid-template-columns:30px minmax(0,1fr);gap:11px}
  .risk-go{grid-column:2;justify-self:start;margin-top:6px}
  .qhead{grid-template-columns:minmax(0,1fr);gap:5px}
  .q-num{grid-row:auto;font-size:var(--t-lg)}
}
@media (max-width:620px){
  .meter{display:none}
  .bar-alert{padding:5px 9px}
  .alert-lbl{display:none}
  .busca{flex-direction:column;gap:5px}
  .why{flex-direction:column;gap:4px}
  .why-lbl{min-width:0}
  .card-foot{flex-wrap:wrap}
  .card-count{flex:1 0 100%}
  .panel{padding:14px 15px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
}

"use strict";

/* ═══════════════════════════════════════════════════════════════

const CIFRAS = [

  ["2025 — promedio mensual", "USD 24.729"],
  ["2026 — enero a junio", "USD 463.235"],

  ["2026 — pico de abril", "USD 117.355"],
  ["Ventana del pitch: ago/25 – jun/26", "USD 587.805"],
  ["└ Maersk (95,0%)", "USD 558.355"],
  ["└ Hapag-Lloyd (2,8%)", "USD 16.600"],
  ["└ CMA-CGM (2,2%)", "USD 12.850"],
  ["Proyección 2026 al ritmo actual", "USD 926.470"]
];

const RIESGOS = {

{tag:"TÉCNICA",para:"para quien valida que sea factible",txt:`Proponemos desarrollar junto con Dow una plataforma web que siga cada contenedor desde el retiro hasta la devolución, con un motor que calcule a diario el free time restante según las reglas contractuales de cada naviera —versionadas por fecha de vigencia— y alerte en semáforo antes del primer cargo. Cubre el ciclo de importación completo, lectura de la sigla por cámara en el portón de planta, bookings, incidencias y prefijos restringidos. Navieras, tarifas, plantas e idioma son configuración, no código: replicarla en otro sitio de la región es parametrizar, no desarrollar de nuevo. Beneficio estimado: USD 118 a 206 mil por año en Bahía Blanca. Sin costo para Dow.`},
{tag:"EJECUTIVA",para:"para entender de un vistazo",txt:`Un tablero que muestra todos los días cuántos días libres le quedan a cada contenedor y avisa antes de que la naviera empiece a cobrar. Lo desarrollamos junto con Dow, arranca en Bahía Blanca y el mismo sistema se replica en las demás plantas de la región cambiando parámetros, no código. Beneficio estimado: USD 118 a 206 mil por año. Sin costo para Dow.`},

{ n:17, tipo:"texto", sec:"La propuesta", estado:"ok",
  q:"Explique cómo funcionaría la solución en la práctica. Incluya etapas principales, áreas involucradas, tecnología/proceso utilizado y cómo participaría Dow en la implementación.",
  qpt:"Explique como a solução funcionaria na prática. Inclua etapas principais, áreas envolvidas, tecnologia/processo utilizado e como a Dow participaria da implementação.",
  busca:"Acá Dow evalúa si es ejecutable o si es una idea linda. Las tres cosas que buscan: qué tienen que poner ellos, si hay que meter a TI, y en cuánto tiempo ven algo.",
  v:[
{tag:"TÉCNICA",para:"siete frentes, con el detalle",txt:`Siete frentes, entregados en fases.

(1) Free time en exportación. Registro por tanda del retiro de vacíos: la lista de contenedores se pega tal cual viene, con validación automática del número según ISO 6346. Un cálculo diario cruza cada contenedor con el free time y la tarifa vigente de su naviera y proyecta el costo de no actuar, con alertas en semáforo verde, amarillo y rojo. Incluye los contenedores que hoy no generan cargo de estadía, que quedan trazados aunque no facturen.

(2) Ciclo completo de importación. Arribo a terminal, retiro de terminal con la mercadería, ingreso a planta y devolución del vacío, que es el evento que corta el reloj. Una orden de importación agrupa varios contenedores con arribo común y retiros escalonados, y el free time de destino se calcula con las reglas de demurrage y detention del contrato de cada naviera.

(3) Reconocimiento de contenedores en portón. Lectura de la sigla por cámara al ingreso y al egreso de planta, con validación del dígito verificador ISO 6346 —que descarta automáticamente las lecturas erróneas— y foto del momento como comprobante. Resuelve el punto ciego actual: hoy la terminal no avisa cuándo un contenedor entró o salió, y esas fechas son las que determinan el cargo. Aplica igual en el ingreso de importación y en la devolución del vacío.

(4) Bookings y roleo. Registro de bookings de retiro, control de ETD, alertas de corte documental y de embarque, y soporte a la reprogramación de contenedores en riesgo de demora.

(5) Incidencias y reclamos. Lavados exigidos al devolver el vacío, daños con costo de refacción y averías, todo con fotos y línea de tiempo, y seguimiento del reclamo hasta la resolución: cuánto se pagó y cuánto se recuperó.

(6) Prefijos restringidos. Validación automática de los prefijos definidos por Dow al momento del ingreso —tanto en exportación como en importación—, más barrido periódico sobre el stock en operación.

(7) Reportes. Exportación a Excel con filtros y resumen periódico automático por correo a la gerencia.

Tecnología: aplicación web en la nube, actualización en tiempo real, perfiles de acceso por rol (operador, supervisor, administrador) y auditoría completa de cambios.

Áreas involucradas: la operación de SSB como usuaria diaria; logística y supply de Dow como destinatarios de los indicadores y del reporte gerencial.

Participación de Dow: validar las reglas de free time y las tarifas negociadas con cada naviera, definir los prefijos restringidos y los destinatarios del reporte, y designar un interlocutor de logística para acompañar el piloto. No requiere integración con sistemas de TI de Dow: la solución es autónoma y se accede por navegador.

Implementación: piloto de 8 semanas en Bahía Blanca sobre el módulo de mayor impacto financiero, que es free time en exportación. Los demás módulos entran en fases siguientes, priorizados junto con Dow.`},
{tag:"EJECUTIVA",para:"el mismo flujo, sin jerga",txt:`Cuando se retiran los contenedores vacíos, se pega la lista en el sistema tal cual viene, sin cargar uno por uno. Desde ese momento el sistema cuenta solo: cada día muestra cuántos días libres le quedan a cada contenedor según lo que Dow tenga negociado con esa naviera, y cuánto costaría si se pasa. Verde, amarillo o rojo. Cuando algo se pone amarillo avisa, y el operador reprograma o prioriza antes de que se cobre.

En importación es el mismo mecanismo: se registra cuándo llegó el barco, cuándo se retiró el contenedor de la terminal, cuándo entró a planta y cuándo se devolvió el vacío, que es lo que corta el reloj.

Y para no depender de que alguien anote las fechas a mano, una cámara en el portón lee la sigla del contenedor cuando entra y cuando sale, verifica sola que la lectura sea correcta y guarda la foto como respaldo. Hoy la terminal no avisa esos movimientos, y son justo los que definen cuánto se cobra.

Lo mismo con los bookings, con las incidencias por lavados exigidos y daños, y con el control de los prefijos que Dow no acepta.

Qué necesitamos de Dow: que nos confirmen el free time y las tarifas acordadas con cada naviera, la lista de prefijos restringidos, y una persona de logística de referencia. Nada de sistemas y nada de TI: se entra por navegador, como a cualquier página.

Cómo arrancamos: 8 semanas en Bahía Blanca con el módulo de free time de exportación, que es donde está la plata. El resto se agrega después, en el orden que Dow prefiera.`},
{tag:"COMERCIAL",para:"organizado por fases y por quién pone qué",txt:`El sistema convierte una planilla que se mira una vez por mes en un tablero que se mira todos los días.

Fase 1 — Piloto. 8 semanas en Bahía Blanca sobre free time de exportación, el módulo donde están los USD 587.805. Se carga el histórico como línea de base, se parametrizan navieras, tarifas y free time, y se opera con alertas en semáforo. Al cierre, reporte con el costo mensual medido contra la línea de base.

Fase 2 — Cobertura completa de la operación. El ciclo de importación entero, desde el arribo a terminal hasta la devolución del vacío. Bookings y roleo. Incidencias con seguimiento del reclamo hasta la recuperación. Control de prefijos restringidos. Y reconocimiento de la sigla del contenedor por cámara en el portón de planta, que elimina la dependencia de que alguien registre a mano las fechas de ingreso y egreso —las mismas que hoy la terminal no informa y que son las que definen el cargo. Acá entran también los contenedores que hoy no facturan estadía y por eso nadie sigue: pasan a estar trazados.

Fase 3 — Réplica regional. Navieras, tarifas, plantas e idioma son parámetros, no código. Llevarlo a otra planta de Dow en la región es una configuración, no un proyecto nuevo.

Qué pone Dow: horas de logística para validar free time, tarifas por naviera y prefijos restringidos, y un interlocutor para el piloto. Sin presupuesto, sin licencias y sin integración con TI.

{ n:22, tipo:"texto", sec:"Diferencial y beneficio", estado:"ok",
  q:"Informe el valor estimado del beneficio financiero anual para Dow, en USD, y explique las principales premisas del cálculo.",

  busca:"La pregunta con más riesgo del formulario. Dow tiene analistas que van a mirar las premisas antes que el número. Un supuesto declarado como supuesto suma credibilidad; un supuesto disfrazado de medición la destruye.",
  v:[
{tag:"TÉCNICA",para:"trazabilidad completa del cálculo",txt:`USD 118.000 a 206.000 por año.

Base de cálculo: acumulado de agosto/2025 a junio/2026 en la exportación de Bahía Blanca = USD 587.805 de detention facturado, tomado de la planilla de costos de la operación, con serie mensual abierta por naviera. Concentración en esa ventana: Maersk USD 558.355 (95,0%), Hapag-Lloyd USD 16.600 (2,8%), CMA-CGM USD 12.850 (2,2%).

Sobre esa base aplicamos dos escenarios de reducción, declarados como hipótesis de trabajo apoyada en benchmarks de detention con alerta anticipada y gestión activa de free time, no como resultado ya medido: escenario conservador, evitar el 20% = USD 117.561 por año; escenario alcanzable, evitar el 35% priorizando el armador de mayor concentración = USD 205.732 por año.

Alcance del cálculo: solo exportación de Bahía Blanca. Quedan fuera, por no tener línea de base, el demurrage y detention de importación, el impacto de bookings e incidencias, y los contenedores cuyo esquema no genera cargo de estadía y por lo tanto no figuran en la serie de costos. La línea de base por contenedor y por día se relevaría durante el piloto.`},
{tag:"EJECUTIVA",para:"la cuenta en cuatro frases",txt:`Entre USD 118 mil y USD 206 mil por año.

La cuenta es directa: en 11 meses se pagaron USD 587.805 de detention en Bahía Blanca. Si con alerta anticipada evitamos el 20%, son USD 118 mil. Si llegamos al 35% enfocándonos en la naviera que concentra el 95% del costo, son USD 206 mil.

El 20% y el 35% son supuestos de trabajo, no algo ya medido: el piloto los confirma o los corrige contra la línea de base real.

El número cubre solo exportación de Bahía Blanca. Importación y el resto de los módulos no están contados.`},
{tag:"COMERCIAL",para:"el número, con el techo a la vista",txt:`USD 118.000 a 206.000 por año, y eso es solo Bahía Blanca y solo exportación.

Punto de partida: USD 587.805 pagados de detention entre agosto/2025 y junio/2026, con el 95% concentrado en Maersk. Sobre ese costo, dos escenarios: evitar el 20% son USD 118 mil; evitar el 35% enfocando el armador dominante son USD 206 mil.

Son escenarios declarados, no promesas. El piloto de 8 semanas los valida contra la línea de base real antes de que Dow comprometa nada.

El potencial es mayor que el número declarado, porque todavía no incluye importación, bookings, incidencias, ni los contenedores que hoy no facturan estadía y por eso nadie controla. Ninguno de ellos tiene línea de base todavía, así que preferimos no contarlos.`}]},

{ n:25, tipo:"texto", sec:"Productividad", estado:"ok",
  q:"¿Cómo se medirá esa ganancia de productividad? Indique KPIs, línea de base actual y resultado esperado, si está disponible.",
  qpt:"Como esse ganho de produtividade será medido? Indique KPIs, baseline atual e resultado esperado, se disponível.",
  busca:"Buscan si tenés línea de base o si vas a inventarla después. Decir “hoy no se mide y lo relevamos en el piloto” es una respuesta fuerte; decir un porcentaje sin fuente es una respuesta débil.",
  v:[
{tag:"TÉCNICA",para:"tres KPIs con su línea de base",txt:`Tres KPIs, medidos mensualmente contra la línea de base registrada en la planilla de costos de la operación.

(1) Costo de detention por mes y por naviera, comparado contra el promedio 2026 de USD 77.206 por mes y contra el pico de abril de USD 117.355.

(2) Porcentaje de contenedores devueltos dentro del free time. Hoy no se mide de forma sistemática: solo se infiere del costo consolidado a fin de mes. La línea de base se releva en las primeras semanas del piloto.

(3) Cobertura de trazabilidad: porcentaje de contenedores de la operación con registro completo en el sistema, incluidos los que no generan cargo de estadía. Línea de base actual: solo el subconjunto que factura detention.

Productividad en horas: el registro por tanda reemplaza la carga fila por fila en Excel y elimina el seguimiento paralelo en planillas separadas —costos, free time de origen, free time de destino e historial de contenedores—; cualquier reporte se genera con un clic en lugar de consolidarse a mano.`},
{tag:"EJECUTIVA",para:"dos números y un control",txt:`Dos números principales, mirados todos los meses.

Cuánto se pagó de detention este mes, comparado contra el promedio de 2026 —USD 77 mil— y contra el peor mes, que fue abril con USD 117 mil.

Qué porcentaje de contenedores se devolvió dentro del free time. Hoy no lo sabemos con precisión; el piloto lo empieza a medir desde la primera semana.

Y un tercero, de control: cuántos contenedores de la operación están efectivamente registrados. Hoy solo los que facturan.

En horas de trabajo: se pega la lista de contenedores en vez de cargarla fila por fila, y los reportes salen con un clic en vez de armarse a mano.`},
{tag:"COMERCIAL",para:"KPIs que Dow puede auditar",txt:`KPI principal: costo mensual de detention. La línea de base ya existe y es auditable —USD 77.206 por mes de promedio en 2026, con pico de USD 117.355 en abril—, y Dow puede verificarla contra sus propias facturas.

KPI secundario: porcentaje de contenedores devueltos dentro del free time, a relevar en las primeras semanas del piloto porque hoy no se mide.

KPI de control: cobertura de trazabilidad sobre el total de contenedores de la operación, no solo sobre los que facturan.

Criterio de éxito del piloto: tendencia de reducción visible en el costo mensual y reporte gerencial entregado con datos del sistema, no con estimaciones reconstruidas a mano.`}]},

{ n:27, tipo:"texto", sec:"Working capital", estado:"ok",
  q:"Si aplica, explique el impacto esperado.", qpt:"Se aplicável, explique o impacto esperado.",
  busca:"Pregunta menor, trampa mayor: si sobrevendés acá, el evaluador desconfía de las respuestas grandes. Conviene ser explícito en que el impacto principal es otro.",
  v:[
{tag:"TÉCNICA",para:"nombra las dos vías",txt:`El impacto principal es sobre costo operativo, no sobre inventario. El aporte a working capital es indirecto y llega por dos vías.

Primera: al priorizar por días libres restantes en lugar de por orden de llegada, se acorta el ciclo de rotación del contenedor. El activo se libera antes y baja la exposición a cargos en curso.

Segunda: el seguimiento documentado de incidencias —lavados exigidos y averías, con evidencia fotográfica y línea de tiempo— reduce el monto en disputa y acorta el plazo hasta recuperar lo cobrado indebidamente, que hoy depende de reconstruir cada caso a mano.`},
{tag:"EJECUTIVA",para:"dos frases, sin inflar",txt:`El impacto grande es en costo, no en stock.

Igual ayuda de dos maneras: los contenedores se despachan o se devuelven antes, porque el sistema muestra cuál está más cerca de vencer; y los reclamos por lavados o averías se resuelven más rápido, porque queda todo registrado con fotos y fechas en vez de tener que reconstruirlo después.`},
{tag:"COMERCIAL",para:"honesto sobre la proporción",txt:`Parcialmente, y conviene decirlo con precisión: el grueso del beneficio es saving directo sobre un costo que hoy se paga todos los meses.

Sobre working capital el efecto es de segundo orden, pero real: menos días de contenedor retenido, y menos plata inmovilizada en reclamos abiertos por lavados y averías que hoy se pierden o se resuelven tarde por falta de evidencia ordenada.`}]},

{tag:"TÉCNICA",para:"cero, línea por línea",txt:`Inversión inicial: íntegramente a cargo de SSB, incluyendo el desarrollo de la plataforma y su infraestructura. Sin costo de desarrollo ni de licenciamiento para Dow.

{tag:"COMERCIAL",para:"cero, y sin costo marginal al escalar",txt:`Sin costo para Dow en ninguna línea: ni inversión inicial, ni licencias, ni recurrentes, ni equipos, ni capacitación. SSB absorbe el desarrollo y la infraestructura como parte del servicio.

Escala sin costo marginal: agregar otra planta o país no genera licencia nueva ni cargo adicional, porque es una parametrización sobre la misma plataforma.

{ n:33, tipo:"texto", sec:"Costo e implementación", estado:"ok",
  q:"¿Cuáles son las principales dependencias, riesgos o restricciones para implementar la propuesta?",
  qpt:"Quais são as principais dependências, riscos ou restrições para implementar a proposta?",
  busca:"La pregunta que separa una propuesta seria de un folleto. Nombrar riesgos con su mitigación genera más confianza que decir que no hay ninguno. Lo que Dow más quiere leer acá: que no depende de su área de TI.",
  v:[
{tag:"TÉCNICA",para:"cinco riesgos con mitigación",txt:`(1) Alcance y plazo. La propuesta cubre siete frentes: free time en exportación, ciclo de importación, reconocimiento de contenedores en portón, bookings, incidencias, prefijos restringidos y reportes. Mitigación: entrega en fases dentro de los tres meses comprometidos, con un piloto acotado de 8 semanas sobre el frente de mayor impacto financiero.

(2) Adopción. Riesgo de doble registro, con la planilla existente conviviendo con el sistema nuevo. Mitigación: puesta en marcha acompañada y designación del sistema como registro único apenas validada la primera parametrización.

(3) Exactitud de las reglas comerciales. Depende de confirmar con Dow el free time, las tarifas negociadas por naviera y los prefijos restringidos. Mitigación: modelo de reglas versionado por fecha de vigencia, actualizable sin perder historial ni recalcular el pasado.

(4) Calidad del dato de entrada. Mitigación: validación ISO 6346 de cada número de contenedor en la carga, y auditoría de toda corrección posterior.

(5) Cobertura parcial de la línea de base. Los contenedores cuyo esquema no genera cargo de estadía no figuran en la serie histórica de costos, por lo que su volumen real se conoce recién al incorporarlos al sistema.

No hay dependencia del área de TI de Dow: la solución es autónoma y se accede por navegador.`},
{tag:"EJECUTIVA",para:"cuatro riesgos, en criollo",txt:`El alcance es grande: siete frentes en tres meses. Lo cortamos en fases y arrancamos por donde está la plata.

Que el equipo siga usando la planilla vieja en paralelo. Se resuelve acompañando la puesta en marcha y declarando el sistema como el único registro válido.

Que las reglas de free time o las tarifas queden mal cargadas. Por eso necesitamos que Dow las confirme; el sistema las guarda con fecha de vigencia, así que actualizarlas después no rompe el historial.

Que se carguen datos con errores. El sistema valida cada número de contenedor al ingresar y guarda quién corrigió qué.

Y una aclaración importante: no dependemos del área de TI de Dow para nada.`},
{tag:"COMERCIAL",para:"ordenado por lo que Dow tiene que poner",txt:`Ninguna dependencia bloqueante y ninguna integración con sistemas de Dow.

Lo único que necesitamos: que Dow confirme el free time y las tarifas negociadas con cada naviera, y la lista de prefijos restringidos. Es la única entrada crítica del sistema, y es información que Dow ya tiene.

Riesgo de plazo: el alcance completo son siete frentes en tres meses. Se mitiga entregando en fases, con un piloto de 8 semanas que produce resultado medible antes de comprometer el resto.

Riesgo de adopción: que convivan la planilla vieja y el sistema nuevo. Se mitiga con puesta en marcha acompañada y un único registro válido.

Riesgo de dato: se mitiga con validación automática de cada número de contenedor y auditoría de toda corrección.`}]},

  v:[
{tag:"TÉCNICA",para:"semana por semana",txt:`Localidad: Bahía Blanca, exportación de PBB Polisur/Dow operada por SSB.

{tag:"EJECUTIVA",para:"las cinco preguntas, contestadas",txt:`Dónde: Bahía Blanca.

{tag:"COMERCIAL",para:"el piloto como molde de la réplica",txt:`8 semanas, Bahía Blanca, sin costo para Dow y con resultado medible al cierre.

const KEY = "dow-summit-2026-revision-v2";
let S = { sel:{}, notas:{}, ok:{}, quien:"" };
try { const raw = localStorage.getItem(KEY); if (raw) Object.assign(S, JSON.parse(raw)); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

const LETRAS = ["A","B","C"];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parrafos = t => t.split(/\n\s*\n/).map(p =>
  "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>").join("");

const PREGUNTAS = ITEMS.filter(i => i.tipo !== "riesgos");
const resuelto = it => it.tipo === "texto" ? !!S.sel[it.n] : !!S.ok[it.n];
const claseDot = it => resuelto(it) ? "hecho"
  : it.estado === "falta" ? "falta"
  : it.estado === "decidir" ? "decidir" : "ok";

/* ═══════════════════════════════════════════════════════════════
   ÍNDICE (columna izquierda)
   ═══════════════════════════════════════════════════════════════ */
function construirRiel(){
  const p = [`<button class="rail-risk" data-ir="pendientes">
      <span>⚠</span><span>Pendientes y decisiones</span></button>`];
  let sec = null;
  PREGUNTAS.forEach(it => {
    if (it.sec !== sec){ sec = it.sec; p.push(`<div class="rail-grp">${esc(sec)}</div>`); }
    p.push(`<button class="rail-item" data-ir="q-${it.n}" id="riel-${it.n}" title="${esc(it.q)}">
        <span class="rail-n">${it.n}</span>
        <span class="dot ${claseDot(it)}" id="dot-${it.n}"></span>
        <span class="rail-t">${esc(it.q)}</span></button>`);
  });
  p.push(`<div class="rail-grp">Cierre</div>
    <button class="rail-item" data-ir="cierre">
      <span class="rail-n">↓</span><span class="dot"></span>
      <span class="rail-t">Lo elegido, para pasarme</span></button>`);
  $("#rail").innerHTML = p.join("");
}

function bloquePendientes(){
  const fila = r => `<div class="risk ${r.g}">
      <span class="risk-ico">${esc(r.ico)}</span>
      <div><h3>${esc(r.t)}</h3><p>${esc(r.d)}</p></div>
      ${r.ir ? `<button class="risk-go" data-ir="q-${r.ir}">ir a ${r.ir} →</button>` : ""}
    </div>`;
  const n = RIESGOS.abiertos.length, m = RIESGOS.resueltos.length;
  const palabra = ["cero","una","dos","tres","cuatro","cinco","seis","siete","ocho","nueve"][n] || n;
  return `<section class="hero" id="pendientes">
      <h1>Quedan ${palabra} ${n === 1 ? "cosa" : "cosas"} para decidir</h1>
      <p>Abajo están las 42 preguntas del formulario, en orden, con las respuestas ya escritas.
      Esto de acá es lo otro: lo que ninguna redacción resuelve. ${m} de estos puntos ya se
      cerraron y quedan listados al final para que veas en qué se decidió cada uno.</p>
      <div class="who">
        <label for="quien">Quién está revisando:</label>
        <input id="quien" type="text" placeholder="tu nombre" value="${esc(S.quien)}">
        <span class="meter-txt">Firma el resumen del final.</span>
      </div>
      <div class="risk-grp">Abiertos</div>
      <div class="risks">${RIESGOS.abiertos.map(fila).join("")}</div>
      <div class="risk-grp">Cerrados en esta sesión</div>
      <div class="risks">${RIESGOS.resueltos.map(fila).join("")}</div>
      <div class="fuente">
        <h4>De dónde salen los números</h4>
        <p style="margin:0 0 11px">Planilla <span class="mono">COSTOS POR DETENTION SEMANAL
        2024-2025-2026</span>, que lleva a mano el equipo en la operación. Serie mensual por
        naviera, actualizada hasta hace una semana. <b>Cerrada: estos números no se tocan.</b></p>
        <table>${CIFRAS.map(c => `<tr><td>${esc(c[0])}</td><td>${esc(c[1])}</td></tr>`).join("")}</table>
      </div>
    </section>`;
}

function chips(it){
  const c = [];
  if (it.tipo === "texto") c.push('<span class="chip escribir">Texto libre · elegí una</span>');
  else if (it.tipo === "opcion") c.push('<span class="chip">Opción a marcar</span>');
  else if (it.estado !== "falta") c.push('<span class="chip">Dato</span>');
  if (it.estado === "falta") c.push('<span class="chip falta">Falta tu dato</span>');
  if (it.estado === "decidir") c.push('<span class="chip decidir">Decisión abierta</span>');
  c.push(`<span class="chip ok" id="chip-ok-${it.n}"
    style="display:${resuelto(it) ? "inline" : "none"}">Revisada ✓</span>`);
  return c.join("");
}

function tarjeta(it, i){
  const v = it.v[i], sel = S.sel[it.n] === LETRAS[i];
  const n = v.txt.length, over = it.limite && n > it.limite;
  return `<article class="card ${sel ? "sel" : ""}" data-letra="${LETRAS[i]}">
      <header class="card-top">
        <span class="card-key">${LETRAS[i]}</span>
        <span class="card-id">
          <span class="card-tag">${esc(v.tag)}</span>
          <span class="card-para">${esc(v.para)}</span>
        </span>
      </header>
      <div class="card-body">${parrafos(v.txt)}</div>
      <footer class="card-foot">
        <span class="card-count ${over ? "over" : ""}">${n} caracteres${over ? " · se pasa" : ""}</span>
        <button class="btn" data-copy="${it.n}:${i}">Copiar</button>
        <button class="btn ${sel ? "" : "btn-primary"}" data-pick="${it.n}:${LETRAS[i]}">
          ${sel ? "Elegida ✓" : "Elegir " + LETRAS[i]}</button>
      </footer>
    </article>`;
}

function cuerpo(it){
  if (it.tipo === "texto"){
    return `<div class="busca"><span class="busca-lbl">Qué busca Dow</span>
        <p>${esc(it.busca)}</p></div>
      <div class="cards">${[0,1,2].map(i => tarjeta(it, i)).join("")}</div>`;
  }
  const ok = !!S.ok[it.n];
  const boton = `<button class="btn ${ok ? "" : "btn-primary"}" data-ok="${it.n}">
      ${ok ? "Revisada ✓" : (it.tipo === "dato" && !it.valor ? "Anotado, lo completo" : "De acuerdo")}
    </button>`;
  if (it.tipo === "opcion"){
    const opts = it.opciones.map(o =>
      `<div class="opt ${o.sel ? "on" : ""} ${it.multi ? "multi" : ""}">
         <span class="radio"></span><span>${esc(o.t)}</span></div>`).join("");
    return `<div class="panel">
        <div class="opts">${opts}</div>
        <div class="why"><span class="why-lbl">Por qué</span><p>${esc(it.porQue)}</p></div>
        ${it.alt ? `<div class="why alt"><span class="why-lbl">Ojo</span><p>${esc(it.alt)}</p></div>` : ""}
        <div class="acciones">${boton}
          <span class="meter-txt">Si lo cambiarías, escribilo en la nota.</span></div>
      </div>`;
  }
  const vacio = !it.valor;
  return `<div class="panel">
      <span class="dato ${vacio ? "vacio" : ""}">${vacio ? "— pendiente de tu dato —" : esc(it.valor)}</span>
      <div class="why"><span class="why-lbl">Nota</span><p>${esc(it.nota)}</p></div>
      <div class="acciones">${boton}</div>
    </div>`;
}

function bloquePregunta(it){
  return `<section class="qb" id="q-${it.n}" data-n="${it.n}">
      <div class="qhead">
        <span class="q-num">${it.n}</span>
        <h2 class="q-title">${esc(it.q)}</h2>
        <div class="q-meta">${chips(it)}
          ${it.qpt ? `<span class="q-pt">${esc(it.qpt)}</span>` : ""}</div>
      </div>
      ${cuerpo(it)}
      <div class="note">
        <label for="nota-${it.n}">Nota para la reunión</label>
        <textarea id="nota-${it.n}" data-nota="${it.n}"
          placeholder="Qué cambiarías, qué preguntar, qué falta…">${esc(S.notas[it.n] || "")}</textarea>
      </div>
    </section>`;
}

function construirDoc(){
  const p = [bloquePendientes()];
  let sec = null;
  PREGUNTAS.forEach(it => {
    if (it.sec !== sec){ sec = it.sec; p.push(`<h2 class="doc-sec">${esc(sec)}</h2>`); }
    p.push(bloquePregunta(it));
  });
  p.push(`<section class="cierre" id="cierre">
      <h2>Lo elegido</h2>
      <p>Se actualiza solo a medida que vas eligiendo. Copiá esto y pasámelo:
      con eso redacto la versión final en portugués para pegar en el formulario.</p>
      <textarea id="salida" readonly spellcheck="false"></textarea>
      <div class="acciones">
        <button class="btn btn-primary" id="copiar">Copiar todo</button>
        <span class="meter-txt" id="copy-msg"></span>
      </div>
    </section>`);
  $("#doc").innerHTML = p.join("");
}

/* ═══════════════════════════════════════════════════════════════
   ACTUALIZACIONES PUNTUALES (sin re-render: no se pierde el scroll)
   ═══════════════════════════════════════════════════════════════ */
function refrescarPregunta(n){
  const it = PREGUNTAS.find(x => String(x.n) === String(n));
  const bloque = document.getElementById("q-" + n);
  if (it.tipo === "texto"){
    bloque.querySelectorAll(".card").forEach(c => {
      const on = S.sel[n] === c.dataset.letra;
      c.classList.toggle("sel", on);
      const b = c.querySelector("[data-pick]");
      b.textContent = on ? "Elegida ✓" : "Elegir " + c.dataset.letra;
      b.classList.toggle("btn-primary", !on);
    });
  } else {
    const on = !!S.ok[n];
    const b = bloque.querySelector("[data-ok]");
    b.textContent = on ? "Revisada ✓"
      : (it.tipo === "dato" && !it.valor ? "Anotado, lo completo" : "De acuerdo");
    b.classList.toggle("btn-primary", !on);
  }
  const chip = document.getElementById("chip-ok-" + n);
  if (chip) chip.style.display = resuelto(it) ? "inline" : "none";
  const dot = document.getElementById("dot-" + n);
  if (dot) dot.className = "dot " + claseDot(it);
  refrescarGlobal();
}

function refrescarGlobal(){
  const hechas = PREGUNTAS.filter(resuelto).length;
  $("#meter").style.width = (hechas / PREGUNTAS.length * 100) + "%";
  $("#meter-txt").textContent = hechas + "/" + PREGUNTAS.length;
  $("#risk-n").textContent = RIESGOS.abiertos.length;
  const s = $("#salida");
  if (s) s.value = armarSalida();
}

   SALIDA
   ═══════════════════════════════════════════════════════════════ */
function armarSalida(){
  const L = ["DOW SUPPLIER PRODUCTIVITY SUMMIT 2026 — REVISION DEL FORMULARIO",
             "Revisado por: " + (S.quien || "(sin firmar)"), ""];
  L.push("PENDIENTES ABIERTOS");
  RIESGOS.abiertos.forEach(r => L.push("  [" + r.ico + "] " + r.t));
  L.push("", "DECISIONES POR PREGUNTA", "");
  PREGUNTAS.forEach(it => {
    const nota = (S.notas[it.n] || "").trim();
    if (it.tipo === "texto"){
      const s = S.sel[it.n];
      if (!s && !nota) return;
      L.push("P" + it.n + " — " + it.q);
      L.push("   Elegida: " + (s ? s + " · " + it.v[LETRAS.indexOf(s)].tag : "SIN ELEGIR"));
    } else {
      if (!S.ok[it.n] && !nota) return;
      L.push("P" + it.n + " — " + it.q);
      const marcada = it.tipo === "opcion"
        ? it.opciones.filter(o => o.sel).map(o => o.t).join(" + ")
        : (it.valor || "PENDIENTE DE DATO");
      L.push("   " + (S.ok[it.n] ? "Confirmada: " : "Sin confirmar: ") + marcada);
    }
    if (nota) L.push("   Nota: " + nota);
    L.push("");
  });
  const sin = PREGUNTAS.filter(i => i.tipo === "texto" && !S.sel[i.n]).map(i => i.n);
  if (sin.length) L.push("TEXTOS SIN VARIANTE ELEGIDA: " + sin.join(", "), "");
  const faltan = PREGUNTAS.filter(i => i.estado === "falta");
  if (faltan.length){
    L.push("DATOS QUE FALTAN");
    faltan.forEach(f => L.push("  P" + f.n + " " + f.q));
  }
  return L.join("\n");
}

/* ═══════════════════════════════════════════════════════════════
   EVENTOS
   ═══════════════════════════════════════════════════════════════ */
function irA(id){
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ block:"start" });
  $("#rail").classList.remove("open");
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-ir],[data-pick],[data-ok],[data-copy]");
  if (!t) return;
  if (t.dataset.ir){ irA(t.dataset.ir); return; }
  if (t.dataset.pick){
    const [n, letra] = t.dataset.pick.split(":");
    S.sel[n] = S.sel[n] === letra ? null : letra;
    save(); refrescarPregunta(n); return;
  }
  if (t.dataset.ok){
    S.ok[t.dataset.ok] = !S.ok[t.dataset.ok];
    save(); refrescarPregunta(t.dataset.ok); return;
  }
  if (t.dataset.copy){
    const [n, i] = t.dataset.copy.split(":");
    const it = PREGUNTAS.find(x => String(x.n) === n);
    copiar(it.v[+i].txt, t);
  }
});

async function copiar(txt, boton){
  const previo = boton.textContent;
  try {
    await navigator.clipboard.writeText(txt);
    boton.textContent = "Copiado ✓";
  } catch(err){
    const ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    boton.textContent = document.execCommand("copy") ? "Copiado ✓" : "No se pudo";
    ta.remove();
  }
  setTimeout(() => { boton.textContent = previo; }, 1600);
}

document.addEventListener("input", e => {
  if (e.target.dataset.nota){
    S.notas[e.target.dataset.nota] = e.target.value; save();
    $("#salida").value = armarSalida();
  }
  if (e.target.id === "quien"){
    S.quien = e.target.value; save();
    $("#salida").value = armarSalida();
  }
});

$("#go-risk").addEventListener("click", () => irA("pendientes"));
$("#go-cierre").addEventListener("click", () => irA("cierre"));
$("#burger").addEventListener("click", () => $("#rail").classList.toggle("open"));
$("#theme").addEventListener("click", () => {
  const actual = document.documentElement.getAttribute("data-theme");
  const oscuro = actual ? actual === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", oscuro ? "light" : "dark");
});

/* ═══════════════════════════════════════════════════════════════
   ARRANQUE
   ═══════════════════════════════════════════════════════════════ */
construirRiel();
construirDoc();
refrescarGlobal();

$("#copiar").addEventListener("click", e => copiar($("#salida").value, e.target));

/* El índice sigue al scroll: marca dónde estás sin que tengas que buscarlo. */
const anclas = [...document.querySelectorAll(".qb, .hero, .cierre")];
const rielDe = el => el.id === "pendientes" ? $('[data-ir="pendientes"]')
  : el.id === "cierre" ? $('[data-ir="cierre"]')
  : document.getElementById("riel-" + el.dataset.n);

let activo = null;
const obs = new IntersectionObserver(() => {
  const y = window.scrollY + 90;
  let cand = anclas[0];
  for (const el of anclas) if (el.offsetTop <= y) cand = el;
  const btn = rielDe(cand);
  if (btn === activo) return;
  if (activo) activo.classList.remove("aqui");
  activo = btn;
  if (btn){
    btn.classList.add("aqui");
    const r = btn.getBoundingClientRect(), c = $("#rail").getBoundingClientRect();
    if (r.top < c.top + 8 || r.bottom > c.bottom - 8){
      btn.scrollIntoView({ block:"center", behavior:"auto" });
    }
  }
}, { rootMargin:"-80px 0px -70% 0px", threshold:0 });
anclas.forEach(a => obs.observe(a));
</script>
