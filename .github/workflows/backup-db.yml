name: Backup DB CRM

# Backup diario de los schemas `crm` (v2, PRODUCCIÓN) y `detention` (v1, legacy)
# — datos + DDL. Ítem 0.2 / finding D-02.
#
# 2026-07-31: hasta hoy este workflow dumpeaba SOLO `detention`, el schema del
# prototipo v1. Los datos vivos del v2 (2.959 operaciones cargadas en M6) están en
# el schema `crm` del mismo proyecto y NO tenían ninguna copia. Se agrega `crm` como
# schema primario; `detention` se mantiene mientras el v1 no esté dado de baja en la DB.
#
# El proyecto Supabase está en plan FREE: sin PITR ni backups descargables, y se
# pausa tras 7 días de inactividad. Este workflow es la única copia recuperable del
# historial (2.900+ contenedores, 11.669 eventos, la lógica de plata) y además
# mantiene el proyecto "activo" evitando el auto-pausado.
#
# REQUISITO (lo setea John una vez): secret SUPABASE_DB_URL en el repo
#   Settings → Secrets and variables → Actions → New repository secret
#   Valor = connection string del dashboard Supabase → Connect →
#           "Session pooler" o "Direct connection" (NO "Transaction pooler":
#           pg_dump necesita sesión, no pooling transaccional).
#   Formato: postgresql://postgres.<ref>:<db-password>@<host>:5432/postgres

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 03:00 America/Argentina/Buenos_Aires
  workflow_dispatch: {}     # permite dispararlo a mano desde la pestaña Actions

concurrency:
  group: backup-crm-db
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Instalar pg_dump 17 (PGDG, matchea Postgres 17 del proyecto)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          # --batch --yes: el runner ya trae este keyring preinstalado y gpg sin tty
          # muere preguntando si sobreescribir — ESTA línea tuvo el backup roto 25 días
          # (0 éxitos desde el 2026-07-07, descubierto 2026-07-31).
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump de los schemas crm (prod) y detention (legacy)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secret SUPABASE_DB_URL. Ver header de este workflow."
            exit 1
          fi
          # Ruta explícita al binario 17: el wrapper pg_dump del runner resuelve al 16
          # preinstalado y v16 aborta contra un server v17 ("server version mismatch",
          # tercera causa de fallo encontrada en la validación end-to-end del 2026-07-31).
          PGDUMP17=/usr/lib/postgresql/17/bin/pg_dump
          "$PGDUMP17" --version
          STAMP=$(date -u +%Y%m%d-%H%M)
          # Custom format comprimido (restore selectivo con pg_restore), datos + DDL:
          "$PGDUMP17" "$SUPABASE_DB_URL" \
            --schema=crm --schema=detention \
            --no-owner --no-privileges \
            --format=custom \
            --file="crm-db-${STAMP}.dump"
          # Copia plain-SQL legible para diff/inspección rápida:
          "$PGDUMP17" "$SUPABASE_DB_URL" \
            --schema=crm --schema=detention \
            --no-owner --no-privileges \
            --format=plain \
            --file="crm-db-${STAMP}.sql"
          ls -lh crm-db-${STAMP}.*
          # Guardrail: si el dump de crm sale vacío, el backup no sirve — fallar fuerte.
          if ! grep -q "CREATE TABLE crm\." "crm-db-${STAMP}.sql"; then
            echo "::error::El dump no contiene tablas del schema crm. Revisar SUPABASE_DB_URL."
            exit 1
          fi
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"

      - name: Subir artifact (retención 90 días)
        uses: actions/upload-artifact@v4
        with:
          name: crm-db-backup-${{ env.STAMP }}
          path: |
            crm-db-*.dump
            crm-db-*.sql
          retention-days: 90
          if-no-files-found: error

      # Aviso ACTIVO de fallo (auditoría 2026-07-31): sin esto, una rotación de la
      # password de la DB mataba el backup en silencio hasta que alguien mirara
      # Actions. El webhook n8n de John guarda el aviso en Drive y manda mail.
      - name: Avisar fallo por n8n
        if: failure()
        run: |
          curl -s -X POST https://jzenteno.app.n8n.cloud/webhook/claude-handoff \
            -H "Content-Type: application/json" \
            -d "{\"chatInput\": \"🔴 BACKUP DB CRM FALLÓ — run ${{ github.run_id }} del $(date -u +%Y-%m-%d\ %H:%M) UTC. Causa más probable: SUPABASE_DB_URL inválido (¿rotó la password de la DB?) o el dump no contiene tablas crm. Ver: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || echo "::warning::No se pudo notificar a n8n (el fallo del backup sigue siendo real)"
